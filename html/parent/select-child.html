  <title>Электронный журнал 40 || Дневник Родителя</title>

<body>

  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>Привязка нового ребенка</h3>
      <p>Введите уникальный код привязки из дневника вашего ребенка</p>
      <input type="text" id="childCodeInput" class="modal-input" placeholder="Например: XYZ-789" autocomplete="off">
      <div class="modal-buttons">
          <button class="btn-submit" id="btnSubmitCode">Привязать</button>
          <button class="btn-cancel" id="btnCancelModal">Отмена</button>
      </div>
    </div>
  </div>

  <main class="main">
    <div class="children-container" id="children-container">

      <!-- <div class="child-card" onclick="selectChild('student_1')">

        <div class="child-class">10-А класс</div>
      </div> -->

      <div class="child-card add-card" id="addChildBtn">
          <!-- <div class="child-avatar">➕</div> -->
          <div class="child-avatar">+</div>
          <div class="child-name">Добавить ребенка</div>
          <div class="child-class">по коду привязки</div>
      </div>

    </div>
    <button class="logout-btn" id="logoutBtn">Выйти из аккаунта</button>
  </main>
